[project]
name = "tag-edgar"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.12",
    "httpx>=0.27",
    "numpy>=2.0",
    "openpyxl>=3.1",
    "rich>=13.7",
    "scikit-learn>=1.5",
    "typer>=0.12",
]

[project.scripts]
tag-edgar = "tag_edgar.cli:app"
tag-edgar-overnight = "tag_edgar.overnight:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "basedpyright",
    "pytest>=8.0",
    "ruff",
]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.basedpyright]
typeCheckingMode = "standard"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
ignore = ["B008"]
